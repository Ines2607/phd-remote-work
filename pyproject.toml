[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote_work_utils"
version = "0.1.0"
description = "Detect home, work, remote-work days and third places from GPS dwell data"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Inessa Tregubova" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pygeohash>=1.2",
    "pyarrow>=14",
    "holidays==0.63",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
place2vec = ["gensim>=4.3", "scipy>=1.11"]
econ = ["statsmodels>=0.14", "scikit-learn>=1.4", "scipy>=1.11"]
dev = ["pytest>=7", "nbmake>=1.5", "nbstripout>=0.7", "jupyter"]

[tool.setuptools.packages.find]
include = ["remote_work_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the original paper scripts (minutes)"]
